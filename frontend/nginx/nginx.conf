# Runs as the unprivileged "nginx" user, so every writable path is under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 64k;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  upstream clinic_space_api {
    server api:8080;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # API calls go to the .NET service, so the browser only sees one origin (no CORS needed).
    # The API sets its own security headers on these responses.
    location /api/ {
      proxy_pass http://clinic_space_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # Hashed build files never change, so they can be cached for a year.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Every other path is a client-side route: serve index.html and never cache it.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
