name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET build, unit and integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore ClinicSpace.slnx
      - name: Build (warnings are errors)
        run: dotnet build ClinicSpace.slnx -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/ClinicSpace.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx" --collect "XPlat Code Coverage" --results-directory ../test-results/backend
      - name: Integration tests (real SQL Server 2022 via Testcontainers)
        run: dotnet test tests/ClinicSpace.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --collect "XPlat Code Coverage" --results-directory ../test-results/backend
      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list ClinicSpace.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q -E "Critical|High" vulnerable.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/backend

  frontend:
    name: Frontend (lint, type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint incl. jsx-a11y)
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit, component and accessibility tests
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage

  e2e:
    name: End-to-end (Playwright against Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SIGN_IN_REQUESTS_PER_MINUTE: "1000" # The suite signs in many times a minute.
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end and accessibility tests
        working-directory: e2e
        run: npx playwright test
      - name: Capture screenshots of every journey
        if: success()
        working-directory: e2e
        run: npm run screenshots
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt; tail -200 compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-and-screenshots
          path: |
            e2e/playwright-report
            e2e/test-results
            docs/screenshots
            compose-logs.txt
      - name: Stop the stack
        if: always()
        run: docker compose down -v
